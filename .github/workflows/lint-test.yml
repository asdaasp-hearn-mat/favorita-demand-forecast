name: Lint and Test Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Astral uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Run Ruff Linter
        run: uv run ruff check src tests configs

      - name: Run Ruff Formatter check
        run: uv run ruff format --check src tests configs

      - name: Run Mypy Type Checker
        run: uv run mypy src tests

      - name: Run Pytest Suite with Coverage
        run: uv run pytest --cov=src --cov-report=xml tests/
