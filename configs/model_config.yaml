# ===========================================================================
# Model Training & Evaluation Configuration
# ===========================================================================

experiment:
  name: "baseline_lgbm_catboost"
  seed: 42
  n_folds: 5
  validation_strategy: "time_series_split"  # Expanding window
  forecast_horizon: 16

# Target preprocessing
target:
  column: "unit_sales"
  log_transform: true  # Apply log1p for variance stabilization
  clip_lower: 0.0

# Weight configuration for NWRMSLE evaluation
weights:
  perishable: 1.25
  non_perishable: 1.00
  perishable_col: "perishable"

# LightGBM hyperparameters
lightgbm:
  objective: "regression"
  metric: "custom"  # Uses NWRMSLE via custom eval function
  boosting_type: "gbdt"
  num_leaves: 127
  learning_rate: 0.03
  n_estimators: 2000
  max_depth: -1
  min_child_samples: 50
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.1
  reg_lambda: 0.1
  early_stopping_rounds: 100
  verbose: -1
  n_jobs: -1

# CatBoost hyperparameters
catboost:
  iterations: 2000
  learning_rate: 0.03
  depth: 8
  l2_leaf_reg: 3.0
  bagging_temperature: 0.8
  random_strength: 0.5
  border_count: 128
  early_stopping_rounds: 100
  verbose: 200
  task_type: "CPU"

# Hierarchical reconciliation
hierarchical:
  enabled: true
  method: "bottom_up"  # Options: bottom_up, optimal_combination
  hierarchy_levels:
    - ["store_nbr", "family"]       # Most granular
    - ["city", "family"]            # City-level
    - ["state", "family"]           # State-level
    - ["family"]                    # National by family
