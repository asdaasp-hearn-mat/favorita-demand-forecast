[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "favorita-demand-forecast"
version = "0.1.0"
description = "Hierarchical Retail Demand Forecasting & Inventory Optimization for Corporación Favorita"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Pauline Lynnea", email = "asdaasp@proton.me" }
]
keywords = [
    "time-series",
    "forecasting",
    "retail",
    "inventory-optimization",
    "polars",
    "duckdb",
    "lightgbm",
    "catboost",
    "mlops"
]
dependencies = [
    "polars>=1.12.0",
    "pyarrow>=18.0.0",
    "duckdb>=1.1.0",
    "numpy>=1.26.0,<3.0.0",
    "scipy>=1.14.0",
    "lightgbm>=4.5.0",
    "catboost>=1.2.7",
    "scikit-learn>=1.5.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.12.20240917",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "NPY", # numpy-specific rules
    "RUF", # ruff-specific rules
]
ignore = ["E501", "RUF002", "TC001", "TC002", "TC003"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = false
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "lightgbm.*",
    "scipy.*",
    "duckdb.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra -q --strict-markers --cov=src --cov-report=term-missing"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
